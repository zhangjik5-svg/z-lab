server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name zhangjik.bbroot.com www.zhangjik.bbroot.com;
    root /var/www/html;

    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name zhangjik.bbroot.com www.zhangjik.bbroot.com;
    root /var/www/html;
    index index.html;

    ssl_certificate /etc/nginx/ssl/zhangjik.bbroot.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/zhangjik.bbroot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;
    gzip on;
    gzip_vary on;
    gzip_static on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /jobs-data.json {
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=7200" always;
        try_files $uri =404;
    }

    location = /api/jobs {
        proxy_pass http://127.0.0.1:8767/api/jobs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
        limit_except GET { deny all; }
    }

    location = /api/account { include proxy_params; proxy_pass http://127.0.0.1:8768; }
    location = /api/tracker { include proxy_params; proxy_pass http://127.0.0.1:8768; }
    location = /api/health { include proxy_params; proxy_pass http://127.0.0.1:8768; }
    location ^~ /api/auth/ { include proxy_params; proxy_pass http://127.0.0.1:8768; }
    location = /api/visit { include proxy_params; proxy_pass http://127.0.0.1:8766/api/visit; }

    location / { try_files $uri $uri/ =404; }
}
