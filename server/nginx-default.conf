server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name zhangjik.bbroot.com www.zhangjik.bbroot.com;
    root /var/www/html;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name zhangjik.bbroot.com www.zhangjik.bbroot.com;
    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    ssl_certificate /etc/nginx/ssl/zhangjik.bbroot.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/zhangjik.bbroot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_static on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /jobs-data.json {
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=7200" always;
        try_files $uri =404;
    }

    location = /api/visit {
        proxy_pass http://127.0.0.1:8766/api/visit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        limit_except GET POST { deny all; }
    }

    location = /api/jobs {
        proxy_pass http://127.0.0.1:8767/api/jobs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        add_header Access-Control-Allow-Origin "*" always;
        limit_except GET { deny all; }
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
